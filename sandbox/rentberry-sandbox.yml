summary: >-
  Rentberry publishes no separate sandbox environment, no test-vs-live key prefixes and no test credentials.
  What it does ship is (a) an interactive Swagger UI console at https://api.rentberry.com/docs that renders
  the full OpenAPI and can execute requests, and (b) a real fixture/trigger surface inside the API itself —
  a `testing-helper` family of operations that provisions listings, applications, proof-of-income
  attachments and contract states, plus a `push-testing-helper` family for push notifications. Those
  operations are declared in the published contract; whether they are reachable outside Rentberry's own
  environments was NOT verified (every unauthenticated call to api.rentberry.com returns 403 "Not enough
  rights").
console:
  url: https://api.rentberry.com/docs
  type: swagger-ui
  version: swagger-ui-dist@5
  try_it_out: true
  note: Executes against the production host; there is no environment switcher.
test_environment:
  separate_host: false
  test_key_prefix: null
  test_mode_flag: null
  test_cards: null
  note: Not published. Payments run through Stripe; no Rentberry-published Stripe test values were found.
