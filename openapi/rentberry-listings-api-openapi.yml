        '404':
          description: Listing not found or deleted
      security:
      - XAuthToken: []
  /v{version}/recommendation:
    get:
      tags:
      - Listings
      summary: Get recommended listings
      description: Available since API version 4. Returns paginated list of recommended listings based on specified criteria.
      operationId: get_api_v4_recommendation_request_get
      parameters:
      - name: type
        in: query
        description: Type of listing recommendation
