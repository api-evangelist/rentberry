          description: Bad request - Validation failed
        '405':
          description: (Real code 21001) Feature disabled - Open house feature is not available
        '429':
          description: Too many requests - Rate limit exceeded
  /v{version}/apartment/open-house/apply/decline/{id}:
    delete:
      tags:
      - Listings
      summary: Decline open house application
      description: Available since API version 1. Declines an open house application. Only the listing owner can decline applications.
      operationId: delete_api_v1_apartment_tour_apply_decline
      parameters:
      - name: id
        in: path
        description: Open house application ID
        required: true
        schema:
          type: integer
          pattern: \d+
      - name: declinedReason
        in: query
        description: Reason for declining the application
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
          pattern: \d+
      responses:
        '200':
          description: Application declined successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenHouseApplication'
        '401':
          description: Unauthorized - Missing or invalid authentication token
        '403':
          description: Forbidden - User does not own this open house application
        '405':
          description: (Real code 12003) Application already accepted
        '406':
          description: (Real code 12004) Application already declined
        '404':
          description: Application not found
      security:
      - XAuthToken: []
  /v{version}/apartment/open-house/apply/accept/{id}:
    put:
      tags:
      - Listings
      summary: Accept open house application
      description: Available since API version 1. Accepts an open house application. Only the listing owner can accept applications.
      operationId: put_api_v1_apartment_tour_apply_accept
      parameters:
      - name: id
        in: path
        description: Open house application ID
        required: true
        schema:
          type: integer
          pattern: \d+
      - name: version
        in: path
        required: true
        schema:
          type: string
          pattern: \d+
      responses:
        '200':
          description: Application accepted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenHouseApplication'
        '401':
          description: Unauthorized - Missing or invalid authentication token
        '403':
          description: Forbidden - User does not own this open house application
        '405':
          description: (Real code 12003) Application already accepted
        '406':
          description: (Real code 12004) Application already declined
        '404':
          description: Application not found
      security:
      - XAuthToken: []
  /v{version}/apartment/{id}/promote:
    post:
      tags:
      - Listings
      summary: Promote listing
      description: Available since API version 1. Promotes a listing to increase its visibility. Requires promote feature to be enabled and consumes a promotion ticket.
      operationId: post_api_v1_apartment_promote
      parameters:
      - name: id
        in: path
        description: Listing ID
        required: true
        schema:
          type: integer
          maximum: 2147483646
          pattern: \d+
      - name: version
        in: path
        required: true
        schema:
          type: string
          pattern: \d+
      responses:
        '200':
          description: Listing promoted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '401':
          description: Unauthorized - Missing or invalid authentication token
        '402':
          description: Payment required - No promotion tickets available
        '405':
          description: (Real code 21001) Feature disabled - Promotion feature is not enabled for this listing
        '403':
          description: Forbidden - User does not own this listing
        '404':
          description: Listing not found or not active
      security:
      - XAuthToken: []
  /v{version}/apartment/{id}/syndicatable:
    get:
      tags:
      - Listings
      summary: Check if listing is syndicatable
      description: Available since API version 1. Checks whether a listing can be syndicated to external platforms.
      operationId: get_api_v1_apartment_is_syndicatable
      parameters:
      - name: id
        in: path
        description: Listing ID
        required: true
        schema:
          type: integer
          maximum: 2147483646
          pattern: \d+
      - name: version
        in: path
        required: true
        schema:
          type: string
          pattern: \d+
      responses:
        '200':
