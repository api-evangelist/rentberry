        description: Type of transaction
        schema:
          type: string
          enum:
          - rental
          - sale
      - name: provider
        in: query
        description: Listing provider filter
        schema:
          type: string
      - name: page
        in: query
        description: Page number
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        description: Number of items per page
        schema:
          type: integer
          default: 10
      - name: version
        in: path
        required: true
        schema:
          type: string
          pattern: \d+
      responses:
        '200':
          description: List of recommended listings
          content:
            application/json:
              schema:
                properties:
                  recommendations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Listing'
                  total:
                    description: Total number of recommendations available
                    type: integer
                type: object
