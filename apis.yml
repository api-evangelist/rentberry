aid: rentberry
name: Rentberry
description: >-
  Rentberry, Inc. is an international long-term home rental marketplace founded in 2015 and headquartered in San
  Francisco, California. The platform runs the whole rental lifecycle in one closed loop for both tenants and
  landlords: property listing and syndication, search across residential rental cities worldwide, virtual tours and
  open-house scheduling, custom rent offers and negotiation, rental applications with proof-of-income attachments,
  US credit and background screening, e-signed rental contracts and contract templates, online rent collection and
  rental subscriptions via Stripe, in-platform messaging, maintenance and complaint handling, and a flexible-living
  concept aimed at digital nomads. Rentberry operates a versioned REST API at api.rentberry.com whose Swagger UI at
  /docs publishes an OpenAPI 3.0.0 description covering applications, auth and social OAuth login, listings, search,
  contracts, screening, payments, rentals, messaging, user verification and localization.
image: https://cdn.rentberry.com/files/seo/main.jpg
url: https://raw.githubusercontent.com/api-evangelist/rentberry/refs/heads/main/apis.yml
x-type: company
x-source: harvest:secondary-market
specificationVersion: '0.23'
created: '2026-08-02'
modified: '2026-08-02'
tags:
- Real-Estate
- PropTech
- Rentals
- Rental Marketplace
- Property Management
- Tenant Screening
- E-Signature
- Payments
- Listings
