apis:
- name: Rentberry Geocoder (gRPC)
  description: >-
    Open-source gRPC geocoding and timezone-lookup service Rentberry built and runs for its own property
    search, with published proto3 definitions and PHP client bindings on Packagist. Two services: GeocodeService.Geocode
    resolves an address or lat/lng into structured Location records (country, state, admin levels, sublocality
    levels, bounds, postal code, timezone, provider components) and TimezoneService.Lookup returns a timezone
    for a coordinate pair.
  humanURL: https://github.com/Rentberry/geocoder
  baseURL: https://github.com/Rentberry/geocoder
  tags:
  - Geocoding
  - gRPC
  - Location
  - Timezone
  - Open-Source
  tags_raw:
  - geocoding
  - grpc
  - location
  - timezone
  - open-source
  properties:
  - type: Protobuf
    url: grpc/rentberry-geocoder.proto
  - type: SourceCode
    url: https://github.com/Rentberry/geocoder
