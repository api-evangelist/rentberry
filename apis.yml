apis:
- name: Rentberry API
  description: >-
    Versioned REST API behind the Rentberry rental marketplace, described by an OpenAPI 3.0.0 document published in
    the Swagger UI at https://api.rentberry.com/docs. 188 paths / 220 operations across 44 tags covering rental
    applications and applicant attachments, authentication and social OAuth (Google, Apple) login, listings and
    listing pictures, virtual tours, search and saved searches, contracts and contract templates with e-signing,
    screening and screening reports, payments, rentals and rental subscriptions, messaging, notifications and
    subscriptions, user profile / settings / verification, geolocation, SEO URLs and translation. Requests are
    authenticated with an X-Auth-Token style bearer token issued by the auth/token operation.
  humanURL: https://api.rentberry.com/docs
  baseURL: https://api.rentberry.com/
  tags:
