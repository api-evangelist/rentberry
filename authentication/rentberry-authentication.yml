social_login:
  note: >-
    The `OAuth` tag covers END-USER social login into Rentberry accounts (Google, Apple) — it is NOT a
    third-party OAuth 2.0 authorization server for API consumers. No /.well-known/openid-configuration or
    /.well-known/oauth-authorization-server is served on rentberry.com or api.rentberry.com (both 404 on
    2026-08-02), and the spec declares no oauth2 security scheme, so no scopes/ artifact is emitted.
  providers:
  - google
  - apple
  operations:
  - get_api_v1_oauth_init
  - get_api_v1_oauth_authorize
  - post_api_v4_google_one_tap
  - get_api_v1_oauth_authorize_by_short_lived_access_token
  - post_api_v4_oauth_apple_callback
  - delete_api_v1_oauth_authorize_disconnect_user
device_identity:
