token_acquisition:
- operationId: post_api_v1_auth_token
  method: POST
  path: /v{version}/auth/token
  summary: Authenticate user and get token
  request:
    required:
    - username
    - plainPassword
    optional:
    - oauthConnectId
    - oauthProvider
    - isRaiUser
  response:
    '200': '{"auth_token": "<string>"}'
    '400': Validation failed
    '401': Authentication failed
